name: Gradle Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 8 and 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --max-workers=1 --no-daemon

      - name: Smoke test server startup
        timeout-minutes: 12
        shell: bash
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          printf 'online-mode=false\nserver-ip=127.0.0.1\nlevel-name=smoke-test\n' > run/server.properties

          setsid ./gradlew runServer --max-workers=1 --no-daemon > server-smoke-test.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            sleep 5
            kill -KILL -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            cat server-smoke-test.log
          }
          trap cleanup EXIT

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo '::error::Server exited before startup completed.'
              exit 1
            fi
            if grep -qE 'Done \([0-9.,]+s\)! For help,' server-smoke-test.log; then
              echo 'Server startup smoke test passed.'
              exit 0
            fi
            sleep 2
          done

          echo '::error::Server did not finish starting within 10 minutes.'
          exit 1

      - name: Upload server smoke test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-smoke-test-log
          path: server-smoke-test.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 30
