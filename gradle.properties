# Gradle/RFG runs on Java 25; Minecraft and mod sources compile with Java 8.
org.gradle.jvmargs = -Xmx4G
use_modern_java_syntax = false
generate_sources_jar = true
generate_javadocs_jar = false
enable_junit_testing = false
show_testing_output = false

mod_version = 2.0.0
root_package = com.github.alexthe666
mod_id = iceandfire
mod_name = Ice and Fire
jar_name = Ice and Fire
mod_description = Ice and Fire adds dragons and other mythological creatures to Minecraft.
mod_authors = Alexthe666, Raptorfarian, Asterixxx, Sekretone, democat3457, Carver, keletu66666
mod_credits =
mod_url =
mod_update_json =
mod_logo_path = assets/iceandfire/textures/logo.png

mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true
minecraft_username = Developer
extra_jvm_args = -Dfml.coreMods.load=com.github.alexthe666.iceandfire.asm.IceAndFirePlugin,net.ilexiconn.llibrary.server.core.plugin.LLibraryPlugin
extra_tweak_classes =
change_minecraft_sources = false

use_tags = false
tag_class_name = com.github.alexthe666.iceandfire.Tags
use_access_transformer = true
access_transformer_locations = META-INF/iceandfire_at.cfg
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = com.github.alexthe666.iceandfire.asm.IceAndFirePlugin

use_mixins = false
mixin_booter_version = 10.2
generate_mixins_json = false
mixin_configs =
mixin_package =
mixin_refmap = mixins.iceandfire.refmap.json
use_asset_mover = false
asset_mover_version = 2.5

publish_to_maven = false
publish_to_local_maven = false
publish_to_curseforge = false
curseforge_project_id = 457668
curseforge_debug = false
publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false
release_type = alpha
publish_with_changelog = false
