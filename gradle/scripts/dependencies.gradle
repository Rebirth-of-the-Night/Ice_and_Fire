repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
    maven {
        name 'BlameJared'
        url 'https://maven.blamejared.com'
        content { includeGroup 'CraftTweaker2' }
    }
}

dependencies {
    implementation rfg.deobf('curse.maven:llibrary-243298:2504999')
    compileOnly rfg.deobf('curse.maven:baubles-227083:2518667')
    compileOnly rfg.deobf('curse.maven:thaumcraft-223628:2629023')
    compileOnly rfg.deobf('curse.maven:hwyla-253449:2545475')
    implementation rfg.deobf('curse.maven:jei-238222:2561546')
    implementation rfg.deobf('curse.maven:mantle-74924:2713386')
    implementation rfg.deobf('curse.maven:tinkers-construct-74072:2902483')
    implementation rfg.deobf('curse.maven:theoneprobe-245211:2667280')
    implementation rfg.deobf('curse.maven:fire-resistance-tiers-382381:2953279')
    implementation rfg.deobf('CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.675')
    if (!propertyBool('use_mixins')) {
        runtimeOnly 'zone.rong:mixinbooter:9.1'
    }
}

// Forge discovers Oceanic Expanse's coremod from run/mods, as in Wilderlands.
def oceanicExpanse = configurations.detachedConfiguration(
    dependencies.create('curse.maven:oceanic-expanse-840576:7009970')
)
def installDevOceanicExpanse = tasks.register('installDevOceanicExpanse', Copy) {
    from oceanicExpanse
    into layout.projectDirectory.dir('run/mods')
    rename { 'OceanicExpanse-1.2.2.jar' }
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    def mappings = tasks.named('generateForgeSrgMappings')
    dependsOn installDevOceanicExpanse, mappings
    extraJvmArgs.add('-Dmixin.env.remapRefMap=true')
    extraJvmArgs.add(mappings.flatMap { it.srgToMcp }.map {
        '-Dmixin.env.refMapRemappingFile=' + it.asFile.absolutePath
    })
}
